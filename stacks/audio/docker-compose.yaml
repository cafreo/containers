services:

# NAVIDROME
  navidrome:
    image: deluan/navidrome:${VERSION_NAVIDROME}
    container_name: navidrome
    restart: unless-stopped
    user: 1000:1000
    environment:
      ND_SCANSCHEDULE: 20m
      ND_LOGLEVEL: debug  
      ND_BASEURL: 
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_AUTOIMPORTPLAYLISTS: true
      ND_PLAYLISTSPATH: Playlists/Import
      ND_ENABLECOVERANIMATION: false
      ND_RECENTLYADDEDBYMODTIME: true
      ND_ENABLEDOWNLOADS: true
      ND_SESSIONTIMEOUT: 72h
      ND_ENABLEMEDIAFILECOVERART: true
      ND_COVERARTPRIORITY: embedded, folder.*, cover.*, front.*, external
      ND_COVERJPEGQUALITY: 75
      ND_ENABLEREPLAYGAIN: true
      ND_JUKEBOX_ENABLED: true
      ND_LASTFM_APIKEY: ${ENV_ND_LASTFM_APIKEY}
      ND_LASTFM_SECRET: ${ENV_ND_LASTFM_SECRET}
      ND_LASTFM_ENABLED: true
      ND_UIWELCOMEMESSAGE: Pass the Aux, Nigga!
      ND_ENABLEINSIGHTSCOLLECTOR: false
      ND_PLUGINS_ENABLED: true
      ND_PLUGINS_FOLDER: ""
      ND_PLUGINS_CACHESIZE: 200MB
      #ND_BACKUP_PATH: /backups
      #ND_BACKUP_SCHEDULE: 0 2 * * 1,3,5
      #ND_BACKUP_COUNT: 12
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/docker/navidrome/data:/data
      - ${VOL1}/Backups/Container/Navidrome:/backups
      - ${VOL1}/Library/Media/Music:/music:ro
      #- ${VOL1}/Library/Media/Audiobooks:/audiobooks:ro
      #- ${VOL1}/Library/Media/Podcasts:/podcasts:ro
    networks:
      - net
      - public
    ports:
      - ${PORT1_NAVIDROME}:4533

# BEETS
  beets:
    image: linuxserver/beets:${VERSION_BEETS}
    container_name: beets
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/docker/beets/config:/config
      - /home/docker/beets/downloads:/downloads
      - ${VOL1}/Library/Media/Music:/music
    networks:
      - net
    ports:
      - ${PORT1_BEETS}:8337

# AUDIOBOOKSHELF
  audiobookshelf:
    image: advplyr/audiobookshelf:${VERSION_AUDIOBOOKSHELF}
    container_name: audiobookshelf
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/docker/audiobookshelf/config:/config
      - /home/docker/audiobookshelf/metadata:/metadata
      - ${VOL1}/Library/Media/Podcasts:/podcasts
      - ${VOL1}/Library/Media/Audiobooks:/audiobooks1
      - ${VOL1}/Library/Torrents/Audiobooks:/audiobooks2
    networks:
      - net
      - public
    ports:
      - ${PORT1_AUDIOBOOKSHELF}:80

# REWIND
  rewind:
    image: bernardogiordano/rewind:${VERSION_REWIND}
    container_name: rewind
    restart: unless-stopped
    environment:
      NG_ALLOWED_HOSTS: ${ENV_REWIND_NG_ALLOWED_HOSTS}
      NAVIDROME_URL: ${ENV_REWIND_NAVIDROME_URL}
      DB_PATH: /data/navidrome.db
    volumes:
      - /home/docker/navidrome/data:/data:ro
    networks:
      - net
      - public
    ports:
      - ${PORT1_REWIND}:4000
      
    
# FEISHIN
  feishin:
    image: ghcr.io/jeffvli/feishin:${VERSION_FEISHIN}
    container_name: feishin
    restart: unless-stopped
    environment:
      SERVER_LOCK: true
      SERVER_TYPE: navidrome
      SERVER_NAME: ${ENV_FEISHIN_SERVER_NAME}
      SERVER_URL: ${ENV_FEISHIN_SERVER_URL}
      REMOTE_URL: ${ENV_FEISHIN_SERVER_URL}
      ANALYTICS_DISABLED: true
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - net
      - public
    ports:
      - ${PORT1_FEISHIN}:9180


networks:
  net:
    driver: bridge
  public:
    name: reverseproxy-stack_net
    external: true

