services:

# MOZILLA SYNCSERVER
  mz-syncserver:
    image: ghcr.io/mozilla-services/syncstorage-rs/syncserver-mysql:${VERSION_MZ_SYNCSERVER}
    platform: linux/amd64
    container_name: mz-syncserver
    restart: unless-stopped
    depends_on:
      sync-db:
        condition: service_healthy
      tokenserver-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/__heartbeat__"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: 8000
      SYNC_MASTER_SECRET: ${ENV_MZ_SYNCSERVER_SYNC_MASTER_SECRET}
      SYNC_SYNCSTORAGE__DATABASE_URL: mysql://${ENV_SYNC_DB_MYSQL_USER}:${ENV_SYNC_DB_MYSQL_PASSWORD}@sync-db:3306/syncstorage
      SYNC_TOKENSERVER__DATABASE_URL: mysql://${ENV_SYNC_DB_MYSQL_USER}:${ENV_SYNC_DB_MYSQL_PASSWORD}@tokenserver-db:3306/tokenserver
      SYNC_TOKENSERVER__ENABLED: true
      SYNC_TOKENSERVER__RUN_MIGRATIONS: true
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: api.accounts.firefox.com
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: https://oauth.accounts.firefox.com
      SYNC_TOKENSERVER__INIT_NODE_URL: ${ENV_SYNC_TOKENSERVER__INIT_NODE_URL}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - net
      - public
    ports:
      - ${PORT1_MZ_SYNCSERVER}:8000

  sync-db:
    image: mysql:${VERSION_MYSQL}
    container_name: mz-syncserver-db
    restart: unless-stopped
    command: --explicit_defaults_for_timestamp
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin -h 127.0.0.1 -usync -psync ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: yes
      MYSQL_DATABASE: syncstorage
      MYSQL_USER: ${ENV_SYNC_DB_MYSQL_USER}
      MYSQL_PASSWORD: ${ENV_SYNC_DB_MYSQL_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/docker/mz-syncserver/sync-db/data:/var/lib/mysql
    networks:
      - net

  tokenserver-db:
    image: mysql:${VERSION_MYSQL}
    container_name: mz-syncserver-token-db
    restart: unless-stopped
    command: --explicit_defaults_for_timestamp
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin -h 127.0.0.1 -usync -psync ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: yes
      MYSQL_DATABASE: tokenserver
      MYSQL_USER: ${ENV_SYNC_DB_MYSQL_USER}
      MYSQL_PASSWORD: ${ENV_SYNC_DB_MYSQL_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/docker/mz-syncserver/token-db/data:/var/lib/mysql
    networks:
      - net

# SYNCTHING
  syncthing:
    image: linuxserver/syncthing:${VERSION_SYNCTHING}
    container_name: syncthing
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/docker/syncthing/config:/config
      - ${VOL1}${VOL2}:/data/Gamesaves
      - ${VOL1}${VOL3}:/data/Signal
    networks:
      - net
    ports:
      - ${PORT1_SYNCTHING}:8384
      - ${PORT2_SYNCTHING}:22000/tcp
      - ${PORT2_SYNCTHING}:22000/udp
      - ${PORT3_SYNCTHING}:21027/udp


networks:
  net:
    driver: bridge
  public:
    name: reverseproxy-stack_net
    external: true
